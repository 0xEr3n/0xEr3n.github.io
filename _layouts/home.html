---
layout: default
---

<div class="home wrapper">
  <section class="hero">
    <h1 class="hero-name">{{ site.author.name }}</h1>
    <p class="hero-tagline">{{ site.tagline }}</p>
    <div class="social-links">
      <span class="find-me-label">Find me on :</span>
      <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener" class="social-link" aria-label="GitHub">
        <svg class="social-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      </a>
      <span class="social-sep">&amp;</span>
      <a href="https://twitter.com/{{ site.author.twitter }}" target="_blank" rel="noopener" class="social-link" aria-label="Twitter / X">
        <svg class="social-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <span class="social-sep">&amp;</span>
      <a href="mailto:manu.shriyansh@gmail.com" class="social-link" aria-label="Email">
        <svg class="social-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      </a>
    </div>
  </section>

  <section class="recent-posts">
    <p class="section-label"><a href="{{ '/posts' | relative_url }}">Writings</a></p>
    <ul class="post-list">
      {% for post in site.posts limit: 5 %}
        <li class="post-item">
          <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
          <a href="{{ post.url | relative_url }}" class="post-link">{{ post.title }}</a>
        </li>
      {% endfor %}
    </ul>
    {% if site.posts.size > 5 %}
      <a href="{{ '/posts' | relative_url }}" class="view-all">all posts →</a>
    {% endif %}
  </section>

  {{ content }}
</div>
